[workspace]
members = ["mrcal-sys"]

[workspace.package]
version = "2.5.2"
edition = "2024"
rust-version = "1.85"
authors = ["Bowan Foryt <bowan@valstad.com>"]
homepage = "https://mrcal.secretsauce.net"
repository = "https://github.com/valstad-shipworks/mrcal-rs"

[package]
name = "mrcal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "Safe Rust bindings to the mrcal camera calibration library"
readme = "README.md"
keywords = ["camera", "calibration", "computer-vision", "photogrammetry", "triangulation"]
categories = ["computer-vision", "api-bindings", "science::robotics"]

[dependencies]
glam = "0.32"
mrcal-sys = { version = "2.5.2", path = "mrcal-sys" }

[dev-dependencies]
serde_json = "1.0.150"

[package.metadata.docs.rs]
all-features = true
